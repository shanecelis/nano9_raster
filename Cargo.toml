[package]
name = "nano9_raster"
version = "0.2.0"
authors = ["Marc Brinkmann <git@marcbrinkmann.de>", "Shane Celis <shane.celis@gmail.com>"]
license = "MIT"
edition = "2021"
readme = "README.md"
description = "A fast, iterator-based integer-only implementation of Bresenham's line algorithm and more."
repository = "https://github.com/shanecelis/nano9_raster"
documentation = "https://docs.rs/nano9_raster"
exclude = ["demo", "graphics", "doc/papers"]

[workspace]
members = ["demo", "demo/record"]
default-members = ["."]

[features]
default = ["line"]
## 2D line (`Line`; alias `Bresenham`)
line = []
## 3D line (`Line3d`)
line3d = []
## Midpoint circle (`Circle`)
circle = []
## Axis-aligned ellipses (`Ellipse`)
ellipse = []
## Filled scanlines (`fill::Span`, `fill::Plot`, `fill::Fill`)
fill = []
## Inclusive `[start, end]` adapter for `Line` and `Line3d`
inclusive = []
## Quadratic Bézier (`QuadBezier`); implies `line`
bezier = ["line", "dep:libm"]
## Anti-aliasing variants of enabled shapes (`LineAa` with `line`, `QuadBezierAa` with `bezier`, `WideLineAa` with `wide-line`)
aa = []
## Anti-aliased circle (`CircleAa`)
circle-aa = ["dep:arraydeque"]
## Anti-aliased ellipses (`EllipseAa`); implies `ellipse` and `circle-aa`
ellipse-aa = ["ellipse", "circle-aa"]
## Thick line (`WideLine`; `WideLineAa` with `aa`)
wide-line = ["dep:libm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
arraydeque = { version = "0.5", default-features = false, optional = true }
libm = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "line"
harness = false
required-features = ["inclusive"]

[[bench]]
name = "line3d"
harness = false
required-features = ["inclusive", "line3d"]

[[bench]]
name = "shape_compare"
harness = false
required-features = ["circle", "ellipse-aa", "fill"]

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
