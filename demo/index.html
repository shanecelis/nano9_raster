<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>nano9_raster</title>
    <link
      data-trunk
      rel="rust"
      data-bin="nano9-raster-demo"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-sign-ext --enable-nontrapping-float-to-int"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #3a3a3a;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 512px;
        height: 384px;
        cursor: crosshair;
        display: block;
        background: #111;
      }
    </style>
  </head>
  <body>
    <canvas id="grid" width="64" height="48"></canvas>
  </body>
</html>
