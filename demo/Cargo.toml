[package]
name = "nano9-raster-demo"
version = "0.1.0"
edition = "2021"
publish = false

[features]
murphy = ["nano9_raster/murphy"]
celis = ["nano9_raster/celis"]

[dependencies]
nano9_raster = { path = "..", default-features = false, features = [
    "line",
    "circle",
    "ellipse",
    "bezier",
    "aa",
    "thick-line",
    "round-rect",
    "fill",
    "inclusive",
] }
wasm-bindgen = { version = "0.2", default-features = false }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "MouseEvent",
    "Window",
] }
